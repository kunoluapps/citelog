# Weekly: are the bundled AI crawler IP ranges still the vendors' current lists? Fails (and emails the maintainers)
# when a list changed; a maintainer then runs `node scripts/refresh-ip-ranges.mjs` and opens a pull request.
name: IP ranges

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/refresh-ip-ranges.mjs --check | tee "$RUNNER_TEMP/ranges.txt"
      - name: Fail when a vendor list changed
        run: |
          cat "$RUNNER_TEMP/ranges.txt" >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '^CHANGED' "$RUNNER_TEMP/ranges.txt"

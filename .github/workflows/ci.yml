name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the CLI bundle
        run: pnpm --filter citelog build
      - name: Committed Action bundle matches its sources
        run: node action/scripts/build.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Repo rules (licence headers, nothing internal)
        run: pnpm check
      - name: npm package contents
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP" && tar -tzf "$RUNNER_TEMP"/citelog-*.tgz

  node-versions:
    name: CLI on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.12', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter citelog build
      - run: node packages/cli/dist/citelog.mjs --version
      - run: node packages/cli/dist/citelog.mjs check packages/cli/test/fixtures/site --no-color

  action:
    name: The Action on this repo's fixture site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./
        with:
          path: packages/cli/test/fixtures/site
          comment: 'false'
